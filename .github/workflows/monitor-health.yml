name: CoinPulse Monitor Health

on:
  schedule:
    # Check twice per hour, offset from the scan schedule and minute 0.
    - cron: "27,57 * * * *"
  workflow_run:
    workflows: ["CoinPulse Cloud Monitor"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coinpulse-state-writer
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A queued health event must inspect the state just published by scan,
          # not the older SHA captured when the event was created. workflow_run
          # events also need the repository default branch, not the source SHA.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check monitor heartbeat
        id: check
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_monitor_health.py --max-age-minutes 120 --max-perp-age-minutes 150

      - name: Save alert transition state
        shell: bash
        run: |
          if [ ! -f monitor_alert_state.json ]; then exit 0; fi
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f monitor_alert_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update monitor health alert state"
          state_branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            if ! git fetch origin "${state_branch}"; then
              echo "fetch conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
              continue
            fi
            if ! git rebase "origin/${state_branch}"; then
              git rebase --abort || true
              echo "rebase conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:${state_branch}; then exit 0; fi
            echo "push conflict; retry ${attempt}/3"
            sleep $((attempt * 2))
          done
          echo "unable to publish health state after retries" >&2
          exit 1

      - name: Collect read-only monitor diagnostics
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_HEARTBEAT_URL: ${{ secrets.EXTERNAL_HEARTBEAT_URL }}
          COINPULSE_STATE_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGERING_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGERING_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGERING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python workflow_diagnostics.py --github --output reports/monitor-diagnostics.json

      - name: Save secret-free monitor diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: monitor-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/monitor-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail stale health check
        if: steps.check.outcome == 'failure'
        run: exit 1
