name: CoinPulse Monitor Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinpulse-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check monitor heartbeat
        id: check
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python check_monitor_health.py --max-age-minutes 20

      - name: Save alert transition state
        shell: bash
        run: |
          if [ ! -f monitor_alert_state.json ]; then exit 0; fi
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f monitor_alert_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update monitor health alert state"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail stale health check
        if: steps.check.outcome == 'failure'
        run: exit 1
