name: CoinPulse Cloud Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test WeChat push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: coinpulse-state-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate config from secrets
        shell: bash
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          export DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python - <<'PY'
          import json, os
          with open("signal_watch.config.template.json", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["dashboard_url"] = os.environ.get("DASHBOARD_URL", "")
          cfg["channels"] = {
                  "dingtalk": {"webhook": os.environ.get("DINGTALK_WEBHOOK", "")},
                  "wecom": {"webhook": os.environ.get("WECOM_WEBHOOK", "")},
                  "serverchan": {"sendkey": os.environ.get("SERVERCHAN_SENDKEY", "")},
                  "pushplus": {"token": os.environ.get("PUSHPLUS_TOKEN", "")},
                  "bark": {"server": "https://api.day.app", "key": os.environ.get("BARK_KEY", "")},
                  "generic": {"webhook": ""}
          }
          with open("signal_watch.config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          PY

      - name: Scan and push
        run: python signal_watch.py --once
        if: github.event.inputs.test_push != 'true'

      - name: Track shadow signals
        run: python track_signals.py
        if: github.event.inputs.test_push != 'true'

      - name: Track perpetual shadow trades
        id: perpetual-shadow
        continue-on-error: true
        run: python perp_shadow.py --config signal_watch.config.json
        if: github.event.inputs.test_push != 'true'

      - name: Report perpetual shadow sample progress
        shell: bash
        run: |
          if [ -f perp_shadow_stats.json ]; then
            python - <<'PY'
            import json
            with open("perp_shadow_stats.json", encoding="utf-8") as f:
                stats = json.load(f)
            print("perpetual shadow sample: closed={closed_count}, open={open_count}, progress={sample_progress_pct}%, reliability={sample_reliability}, next={sample_next_milestone}".format(**stats))
            print("perpetual shadow data coverage: {}/{} symbols; status={}; unavailable_runs={}".format(len(stats.get("successful_symbols", [])), len(stats.get("requested_symbols", [])), stats.get("data_status"), stats.get("consecutive_unavailable_runs", 0)))
            if stats.get("errors"):
                print("perpetual shadow data errors:", stats["errors"])
            PY
          else
            echo "perpetual shadow stats missing; the step may have failed before writing state" >&2
          fi
        if: github.event.inputs.test_push != 'true'

      - name: Send test push
        run: python signal_watch.py --test
        if: github.event.inputs.test_push == 'true'

      - name: Validate runtime state
        run: python validate_runtime_state.py
        if: github.event.inputs.test_push != 'true'

      - name: Validate perpetual shadow state
        run: python validate_perp_shadow.py
        if: github.event.inputs.test_push != 'true'

      - name: Save signal state
        shell: bash
        run: |
          if [ ! -f signal_watch.state.json ]; then
            echo "no state file yet, skip"
            exit 0
          fi
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in signal_watch.state.json signal_records.json signal_tracking_stats.json signal_quality_report.json trade_stats.json monitor_health.json perp_shadow_state.json perp_shadow_stats.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if [ -d signal_archive ]; then
            git add -f signal_archive
          fi
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update signal state"
            for attempt in 1 2 3; do
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "fetch conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "rebase conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
              echo "push conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
            done
            echo "unable to publish signal state after retries" >&2
            exit 1
          fi
