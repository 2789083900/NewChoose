name: CoinPulse Cloud Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test WeChat push"
        required: false
        default: false
        type: boolean
      test_perp_push:
        description: "Send a perpetual shadow test push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: coinpulse-state-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore perpetual runtime cache
        uses: actions/cache@v4
        with:
          path: perp_runtime_cache
          key: perpetual-runtime-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            perpetual-runtime-cache-

      - name: Generate config from secrets
        shell: bash
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          export DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python - <<'PY'
          import json, os
          with open("signal_watch.config.template.json", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["dashboard_url"] = os.environ.get("DASHBOARD_URL", "")
          cfg["channels"] = {
                  "dingtalk": {"webhook": os.environ.get("DINGTALK_WEBHOOK", "")},
                  "wecom": {"webhook": os.environ.get("WECOM_WEBHOOK", "")},
                  "serverchan": {"sendkey": os.environ.get("SERVERCHAN_SENDKEY", "")},
                  "pushplus": {"token": os.environ.get("PUSHPLUS_TOKEN", "")},
                  "bark": {"server": "https://api.day.app", "key": os.environ.get("BARK_KEY", "")},
                  "generic": {"webhook": ""}
          }
          with open("signal_watch.config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          PY

      - name: Scan and push
        run: python signal_watch.py --once
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Track shadow signals
        run: python track_signals.py
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Track perpetual shadow trades
        id: perpetual_shadow
        continue-on-error: true
        run: python perp_shadow.py --config signal_watch.config.json
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Report perpetual shadow sample progress
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          if not os.path.exists("perp_shadow_stats.json"):
              print("perpetual shadow stats missing; the step may have failed before writing state")
          else:
              with open("perp_shadow_stats.json", encoding="utf-8") as f:
                  stats = json.load(f)
              print("perpetual shadow sample: closed={closed_count}, open={open_count}, progress={sample_progress_pct}%, reliability={sample_reliability}, next={sample_next_milestone}".format(**stats))
              print("perpetual shadow remaining: minimum={}, preferred={}".format(stats.get("sample_remaining_to_minimum"), stats.get("sample_remaining_to_preferred")))
              print("perpetual shadow configured-symbol coverage:", stats.get("configured_symbol_sample_coverage", {}))
              print("perpetual shadow sample groups:", stats.get("sample_breakdown", {}))
              print("perpetual shadow data coverage: {}/{} symbols; status={}; unavailable_runs={}".format(len(stats.get("successful_symbols", [])), len(stats.get("requested_symbols", [])), stats.get("data_status"), stats.get("consecutive_unavailable_runs", 0)))
              print("perpetual shadow providers:", {symbol: health.get("provider") for symbol, health in (stats.get("symbol_health") or {}).items()})
              print("perpetual shadow provider attempts:", {symbol: health.get("provider_attempts") for symbol, health in (stats.get("symbol_health") or {}).items()})
              print("perpetual shadow provider redundancy:", stats.get("provider_redundancy", {}))
              print("perpetual shadow market freshness:", {symbol: {"status": health.get("market_data_freshness"), "lag_minutes": health.get("market_data_lag_minutes"), "max_lag_minutes": health.get("market_data_max_lag_minutes")} for symbol, health in (stats.get("symbol_health") or {}).items()})
              print("perpetual shadow signal funnel:", stats.get("signal_funnel", {}))
              print("perpetual shadow latest signal diagnostics:", stats.get("last_signal_diagnostics_by_symbol", {}))
              print("perpetual shadow active cohort:", {"strategy_version": stats.get("strategy_version"), "cohort_id": stats.get("cohort_id"), "status": stats.get("cohort_status"), "new_entries_enabled": stats.get("new_entries_enabled"), "closed_count": stats.get("active_cohort_closed_count")})
              print("perpetual shadow uncertain reconciliations:", stats.get("reconciliation_uncertain_count", 0))
              print("perpetual shadow risk tiers:", (stats.get("liquidation_model") or {}).get("active_tier_metadata_by_symbol", {}))
              print("perpetual shadow risk tier health:", stats.get("risk_tier_health", {}))
              if stats.get("cached_symbols"):
                  print("perpetual shadow cached symbols (health only):", stats["cached_symbols"])
              if stats.get("errors"):
                  print("perpetual shadow data errors:", stats["errors"])
          PY
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Send test push
        run: python signal_watch.py --test
        if: github.event.inputs.test_push == 'true'

      - name: Send perpetual test push
        run: python perp_shadow.py --config signal_watch.config.json --test-notification
        if: github.event.inputs.test_perp_push == 'true'

      - name: Validate runtime state
        run: python validate_runtime_state.py
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Validate perpetual shadow state
        id: validate_perpetual_shadow
        continue-on-error: true
        run: python validate_perp_shadow.py --max-age-minutes 30
        if: github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'

      - name: Save ordinary signal state
        id: save_ordinary_state
        shell: bash
        if: always() && github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true'
        run: |
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rebase.autoStash true
          for file in signal_watch.state.json signal_records.json research_signal_records.json signal_tracking_stats.json research_signal_tracking_stats.json signal_quality_report.json trade_stats.json monitor_health.json notification_outbox.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if [ -d signal_archive ]; then
            git add -f signal_archive
          fi
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update ordinary signal state"
            for attempt in 1 2 3; do
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "fetch conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "rebase conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
              echo "push conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
            done
            echo "unable to publish signal state after retries" >&2
            exit 1
          fi

      - name: Save perpetual shadow state
        id: save_perpetual_state
        shell: bash
        if: always() && github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true' && steps.perpetual_shadow.outcome == 'success' && steps.validate_perpetual_shadow.outcome == 'success'
        run: |
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rebase.autoStash true
          for file in perp_shadow_state.json perp_shadow_stats.json notification_outbox.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "perpetual shadow state unchanged"
          else
            git commit -m "chore: update perpetual shadow state"
            for attempt in 1 2 3; do
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "fetch conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "rebase conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
              echo "push conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
            done
            echo "unable to publish perpetual shadow state after retries" >&2
            exit 1
          fi

      - name: Validate reliable notification delivery
        id: validate_notifications
        if: always() && github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true' && steps.save_ordinary_state.outcome == 'success' && steps.save_perpetual_state.outcome == 'success'
        run: python validate_notification_outbox.py --health monitor_health.json --config signal_watch.config.json

      - name: Send external success heartbeat
        continue-on-error: true
        if: success() && github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true' && steps.perpetual_shadow.outcome == 'success' && steps.validate_perpetual_shadow.outcome == 'success' && steps.validate_notifications.outcome == 'success' && steps.save_ordinary_state.outcome == 'success' && steps.save_perpetual_state.outcome == 'success'
        env:
          EXTERNAL_HEARTBEAT_URL: ${{ secrets.EXTERNAL_HEARTBEAT_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          raw_url = os.environ.get("EXTERNAL_HEARTBEAT_URL", "").strip()
          if not raw_url:
              print("external heartbeat is not configured; skipping")
              raise SystemExit(0)
          parsed = urlsplit(raw_url)
          if parsed.scheme != "https" or not parsed.netloc or any(char.isspace() for char in raw_url):
              print("EXTERNAL_HEARTBEAT_URL must be an HTTPS URL", file=sys.stderr)
              raise SystemExit(1)

          request = urllib.request.Request(
              raw_url,
              method="GET",
              headers={
                  "User-Agent": "CoinPulse-GitHubActions-Heartbeat",
                  "X-CoinPulse-Run-ID": os.environ.get("GITHUB_RUN_ID", ""),
                  "X-CoinPulse-Commit": os.environ.get("GITHUB_SHA", ""),
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  print(f"external heartbeat acknowledged: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              print(f"external heartbeat returned HTTP {exc.code}", file=sys.stderr)
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              print(f"external heartbeat failed: {exc}", file=sys.stderr)
              raise SystemExit(1)

      - name: Fail when perpetual shadow processing failed
        if: always() && github.event.inputs.test_push != 'true' && github.event.inputs.test_perp_push != 'true' && (steps.perpetual_shadow.outcome == 'failure' || steps.validate_perpetual_shadow.outcome == 'failure')
        run: |
          echo "perpetual shadow execution or validation failed; stale shadow state was not published" >&2
          exit 1
