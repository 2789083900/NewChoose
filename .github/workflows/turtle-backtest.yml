name: CoinPulse Turtle Backtest

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      bars:
        description: "4h历史K线数量"
        required: false
        default: "3600"
        type: string
      test_ratio:
        description: "样本外数据比例"
        required: false
        default: "0.3"
        type: string
      refresh_data:
        description: "重新下载历史数据快照"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # All scheduled jobs that commit runtime/report artifacts share one writer
  # lock, so a weekly backtest cannot race the 5-minute monitor push.
  group: coinpulse-state-writer
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run turtle backtest
        env:
          BARS: ${{ github.event.inputs.bars || '3600' }}
          TEST_RATIO: ${{ github.event.inputs.test_ratio || '0.3' }}
          REFRESH_DATA: ${{ github.event.inputs.refresh_data || 'false' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "$REFRESH_DATA" = "true" ]; then EXTRA="--refresh-data"; fi
          python backtest_turtle.py \
            --bars "$BARS" \
            --config signal_watch.config.template.json \
            --test-ratio "$TEST_RATIO" \
            --fee-rate 0.001 \
            --slippage 0.0005 \
            --portfolio-max-total-units 12 \
            --portfolio-max-direction-units 12 \
            --rolling-train-bars 2160 \
            --rolling-test-bars 540 \
            --rolling-step-bars 540 \
            --output turtle_backtest_compare.json $EXTRA

      - name: Run tests
        run: python -m unittest discover -v

      - name: Compare S1 fast research with S2 baseline
        env:
          BARS: ${{ github.event.inputs.bars || '3600' }}
          TEST_RATIO: ${{ github.event.inputs.test_ratio || '0.3' }}
        run: >-
          python compare_spot_research.py
          --bars "$BARS"
          --test-ratio "$TEST_RATIO"
          --config signal_watch.config.template.json
          --output spot_fast_research_compare.json

      - name: Validate report before publish
        run: python validate_reports.py --backtest turtle_backtest_compare.json --spot-research spot_fast_research_compare.json

      - name: Publish report
        shell: bash
        run: |
          git config user.name "coinpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f turtle_backtest_compare.json spot_fast_research_compare.json backtest_data
          if git diff --cached --quiet; then
            echo "backtest report unchanged"
          else
            git commit -m "chore: update turtle backtest report"
            for attempt in 1 2 3; do
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "fetch conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "rebase conflict; retry ${attempt}/3"
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
              echo "push conflict; retry ${attempt}/3"
              sleep $((attempt * 2))
            done
            echo "unable to publish backtest report after retries" >&2
            exit 1
          fi
